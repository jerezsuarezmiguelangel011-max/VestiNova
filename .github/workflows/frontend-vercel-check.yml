name: VestiNova Frontend CI

on:
  push:
    branches:
      - deploy/vercel-angular
      - miguel
  pull_request:
    branches:
      - miguel

jobs:
  angular-build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify Vercel output
        run: test -f dist/vestinova-mvp/browser/index.html

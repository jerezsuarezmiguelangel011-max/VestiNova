name: VestiNova Mobile Block 2
on:
  push:
    branches:
      - trabajo/movil-bloque2
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart fix --apply lib/commerce
      - run: dart fix --apply lib/reservations
      - run: dart format lib/commerce lib/storefront lib/reservations
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter test --no-pub
      # APK de demostración para Redmi real (misma Wi-Fi que el backend).
      # Sin google-services.json en CI: permite verificar CU08/CU09/CU10/CU25,
      # pero no declara probada la recepción push FCM de CU26.
      - name: Construir APK Android demo para Redmi
        env:
          VESTINOVA_CI_TEST_APK: "1"
        run: flutter build apk --debug --no-pub --dart-define=API_BASE_URL=http://192.168.0.9:8001/api
      - name: Publicar APK Android de prueba
        uses: actions/upload-artifact@v4
        with:
          name: VestiNova-Redmi-Bloque2
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest -q tests/test_cu09_mobile_deferred_contract.py tests/test_cu09_mobile_offline_integration.py tests/test_cu09_stripe_flujos_alternativos.py tests/test_cu10_reservas_online.py tests/test_cu25_valoraciones.py tests/test_public_availability.py

name: VestiNova Mobile Block 2
on:
  push:
    branches:
      - trabajo/movil-bloque2
  workflow_dispatch:
permissions:
  contents: write
jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart fix --apply lib/commerce
      - run: dart fix --apply lib/reservations
      - run: dart format lib/commerce lib/storefront lib/reservations
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter test --no-pub
      - name: Publish automatic Dart lint fixes on the working branch
        if: success()
        run: |
          git config user.name "VestiNova CI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib/commerce mobile/lib/storefront mobile/lib/reservations
          if ! git diff --cached --quiet; then
            git commit -m "style(movil): aplicar correcciones sugeridas por Dart"
            git push origin HEAD:refs/heads/trabajo/movil-bloque2
          fi
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest -q tests/test_cu09_mobile_deferred_contract.py

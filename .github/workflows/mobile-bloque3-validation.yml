name: VestiNova Mobile Block 3
on:
  push:
    branches:
      - trabajo/movil-bloque3
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/staff lib/auth/session_controller.dart lib/auth/session_store.dart lib/screens/account_page.dart test/staff_cash_test.dart test/session_controller_test.dart
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter test --no-pub
      - name: Build APK debug para Redmi (sin FCM privado)
        env:
          VESTINOVA_CI_TEST_APK: "1"
        run: flutter build apk --debug --no-pub --dart-define=API_BASE_URL=http://192.168.0.9:8001/api
      - uses: actions/upload-artifact@v4
        with:
          name: VestiNova-Redmi-Bloque3
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest -q tests/test_cu14_cu15_cu13_web.py tests/test_sync_conflicts_domain.py tests/test_cu10_reservas_online.py

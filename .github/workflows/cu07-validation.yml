name: VestiNova CU07 validation

on:
  push:
    branches:
      - trabajo/cu07-miguel
      - trabajo/cu07-kardex-miguel
  workflow_dispatch:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Frontend tests
        run: npm test
      - name: Production build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: CU07 backend regression tests
        run: python -m pytest -q tests/inventory tests/test_tenancy_inventory.py

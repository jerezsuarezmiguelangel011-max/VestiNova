name: VestiNova - Integracion Android

on:
  push:
    branches:
      - "integracion/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-pub --no-fatal-infos
      - run: flutter test --no-pub

      - name: Compilar APK integrado
        env:
          VESTINOVA_CI_TEST_APK: "1"
        run: flutter build apk --debug --no-pub --dart-define=API_BASE_URL=http://192.168.0.9:8001/api

      - uses: actions/upload-artifact@v4
        with:
          name: VestiNova-Integrado-Miguel-Salet
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

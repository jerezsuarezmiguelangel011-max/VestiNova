# Límites conservadores para equipos Windows con espacio restringido en C:.
# El heap de 8 GiB ocasionaba alta presión de memoria durante assembleDebug.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
org.gradle.parallel=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Windows: evitar errores de caché Kotlin cuando dependencias están en C: y el proyecto en D:
kotlin.incremental=false
